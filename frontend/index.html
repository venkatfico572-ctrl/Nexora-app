<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora - Account Management</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #f1f3f6; padding: 15px; color: #212121; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #2874f0; margin-bottom: 15px; text-align: center; font-size: 20px; }
    .nav-tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #878787; }
    .tab.active { color: #2874f0; border-bottom: 3px solid #2874f0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #666; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #fb641b; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { background: #e65100; }
    .hidden { display: none; }
    .profile-card { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #e0e0e0; margin-top: 15px; }
    .address-box { border: 1px solid #ddd; padding: 10px; border-radius: 4px; margin-top: 10px; background: #fff; }
    .tag { background: #2874f0; color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Nexora Shopping</h2>

  <!-- Auth Tabs -->
  <div id="authTabs" class="nav-tabs">
    <div class="tab active" onclick="switchTab('login')">Login</div>
    <div class="tab" onclick="switchTab('register')">Register</div>
  </div>

  <!-- Login Form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" required placeholder="enter email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" required placeholder="enter password">
    </div>
    <button type="submit">Login to Account</button>
  </form>

  <!-- Register Form -->
  <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" required placeholder="Name">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" required placeholder="Email">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="regPhone" required placeholder="Phone number">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" required placeholder="Password">
    </div>
    <button type="submit">Create Account</button>
  </form>

  <!-- Profile Section (Hidden by Default) -->
  <div id="profileSection" class="hidden">
    <div class="profile-card">
      <h3 id="userName">User Name</h3>
      <p id="userEmail" style="color: #666; font-size: 14px;"></p>
      <p id="userPhone" style="color: #666; font-size: 14px;"></p>
    </div>

    <h4 style="margin-top: 20px;">Saved Delivery Addresses</h4>
    <div id="addressList"></div>

    <h4 style="margin-top: 20px;">Add New Delivery Address</h4>
    <form id="addressForm" onsubmit="handleAddAddress(event)" style="margin-top: 10px;">
      <div class="form-group"><input type="text" id="addrStreet" placeholder="House No, Street, Area" required></div>
      <div class="form-group"><input type="text" id="addrCity" placeholder="City" required></div>
      <div class="form-group"><input type="text" id="addrState" placeholder="State" required></div>
      <div class="form-group"><input type="text" id="addrPincode" placeholder="Pincode" required></div>
      <div class="form-group"><input type="text" id="addrType" placeholder="Address Type (Home / Work)" required></div>
      <button type="submit" style="background: #2874f0;">Save Address</button>
    </form>
  </div>
</div>

<script>
  let currentUser = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(tab === 'login') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const data = {
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      phone: document.getElementById('regPhone').value,
      password: document.getElementById('regPassword').value
    };
    const res = await fetch('/api/user/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    alert(result.message);
    if(result.success) {
      currentUser = result.user;
      showProfile();
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const data = {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    };
    const res = await fetch('/api/user/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    alert(result.message);
    if(result.success) {
      currentUser = result.user;
      showProfile();
    }
  }

  async function handleAddAddress(e) {
    e.preventDefault();
    const address = {
      street: document.getElementById('addrStreet').value,
      city: document.getElementById('addrCity').value,
      state: document.getElementById('addrState').value,
      pincode: document.getElementById('addrPincode').value,
      type: document.getElementById('addrType').value
    };
    const res = await fetch('/api/user/address', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, address })
    });
    const result = await res.json();
    alert(result.message);
    if(result.success) {
      currentUser.addresses = result.addresses;
      renderAddresses();
      document.getElementById('addressForm').reset();
    }
  }

  function showProfile() {
    document.getElementById('authTabs').classList.add('hidden');
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.add('hidden');
    document.getElementById('profileSection').classList.remove('hidden');

    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('userEmail').innerText = 'Email: ' + currentUser.email;
    document.getElementById('userPhone').innerText = 'Phone: ' + currentUser.phone;
    renderAddresses();
  }

  function renderAddresses() {
    const list = document.getElementById('addressList');
    list.innerHTML = '';
    if(currentUser.addresses.length === 0) {
      list.innerHTML = '<p style="color:#999; font-size:13px;">No saved addresses yet.</p>';
      return;
    }
    currentUser.addresses.forEach(a => {
      list.innerHTML += `
        <div class="address-box">
          <span class="tag">${a.type.toUpperCase()}</span>
          <p style="font-size:14px; font-weight:bold; margin-top:5px;">${a.street}</p>
          <p style="font-size:12px; color:#666;">${a.city}, ${a.state} - ${a.pincode}</p>
        </div>
      `;
    });
  }
</script>
</body>
</html>
